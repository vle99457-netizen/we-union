name: Install Taste Skill

on:
  push:
    branches:
      - agent/install-taste-skill
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Taste Skill for Claude Code
        env:
          DISABLE_TELEMETRY: '1'
        run: npx --yes skills add https://github.com/Leonxlnx/taste-skill --skill design-taste-frontend --agent claude-code --copy --yes

      - name: Commit installed skill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills
          if git diff --cached --quiet; then
            echo "Taste Skill is already installed."
            exit 0
          fi
          git commit -m "install Taste Skill"
          git push
