name: Install UI UX Skill Pack

on:
  push:
    branches:
      - agent/install-ui-ux-skill-pack

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/install-ui-ux-skill-pack

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install UI UX Pro Max
        run: npx --yes ui-ux-pro-max-cli init --ai claude

      - name: Install Vercel Web Design Guidelines
        run: npx --yes skills add https://github.com/vercel-labs/agent-skills --skill web-design-guidelines --agent claude-code --copy --yes

      - name: Validate installed skills
        run: |
          test -f .claude/skills/ui-ux-pro-max/SKILL.md
          test -f .claude/skills/web-design-guidelines/SKILL.md
          python3 .claude/skills/ui-ux-pro-max/scripts/search.py "sports apparel ecommerce" --domain style >/tmp/uipro-check.txt
          grep -q "name: web-design-guidelines" .claude/skills/web-design-guidelines/SKILL.md

      - name: Commit installed skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/ui-ux-pro-max .claude/skills/web-design-guidelines
          if git diff --cached --quiet; then
            echo "No skill changes to commit"
          else
            git commit -m "install UI UX design skill pack"
            git push origin HEAD:agent/install-ui-ux-skill-pack
          fi
